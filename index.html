<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Quick Copy</title>
<style>
:root {font-family:system-ui,sans-serif;color:#183047;background:#f3f6f9;color-scheme:light}
body {margin:0;min-height:100vh;display:grid;place-items:center}
main {width:min(440px,calc(100% - 64px));padding:32px;background:white;border:1px solid #dce4ec;border-radius:16px;box-shadow:0 10px 35px #1830470a}
h1 {font-size:24px;margin:0 0 12px} p {line-height:1.5;color:#526579}
button {background:#0067b8;color:white;border:0;border-radius:7px;padding:12px 20px;font:inherit;cursor:pointer}
textarea {display:block;box-sizing:border-box;width:100%;min-height:100px;margin:16px 0;padding:12px;border:1px solid #b5c4d2;border-radius:7px;font:inherit}
[hidden] {display:none!important} button:focus-visible,textarea:focus-visible {outline:3px solid #65b9ff;outline-offset:3px}
</style>
</head>
<body>
<main>
<h1 id="heading">Copying…</h1>
<p id="status" role="status" aria-live="polite">This tab will close as soon as your text is copied.</p>
<textarea id="text" aria-label="Text to copy" readonly hidden></textarea>
<button id="copy" type="button" hidden>Copy text</button>
</main>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const hasText = params.has('copy');
const text = params.get('copy') ?? '';
const heading = document.getElementById('heading');
const status = document.getElementById('status');
const field = document.getElementById('text');
const button = document.getElementById('copy');
// Remove the supplied text from the address bar without navigating away.
try { history.replaceState(null, '', location.pathname); } catch (_) {}
field.value = text;
let busy = false;
async function copyText() {
  if (busy) return;
  busy = true;
  button.disabled = true;
  try {
    await navigator.clipboard.writeText(text);
    heading.textContent = 'Copied!';
    status.textContent = 'You can close this tab and return to SharePoint.';
    field.hidden = true;
    button.hidden = true;
    // No fixed delay and no clipboard read permission required.
    window.close();
  } catch (_) {
    heading.textContent = 'Copy your text';
    status.textContent = 'Select Copy text to allow copying. If your browser still blocks it, select the text below and copy it manually.';
    field.hidden = false;
    button.hidden = false;
  } finally {
    busy = false;
    button.disabled = false;
  }
}
button.addEventListener('click', copyText);
if (hasText) {
  copyText();
} else {
  heading.textContent = 'Quick Copy';
  status.textContent = 'Add ?copy= followed by URL-encoded text to this page’s link. Example: ?copy=Hello%20world';
}
</script>
</body>
</html>
